# BrewMe API — nginx reverse proxy
# Place at: /etc/nginx/sites-available/brewme-backend
# Then symlink into sites-enabled (see deploy/README.md).
#
# The Go app listens on 127.0.0.1:8080 (see cmd/server/main.go).

# Redirect all HTTP -> HTTPS (enable after certbot has issued a cert).
server {
    listen 80;
    listen [::]:80;
    server_name api.brewme.example.com;   # <-- change to your domain

    # Let certbot serve the ACME challenge over plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.brewme.example.com;   # <-- change to your domain

    # TLS — paths created by certbot (see setup steps).
    ssl_certificate     /etc/letsencrypt/live/api.brewme.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.brewme.example.com/privkey.pem;

    # Allow avatar/media uploads through the proxy.
    client_max_body_size 10M;

    # Serve uploaded files straight from disk (faster than going through Go).
    # The app writes them to <working dir>/uploads, i.e. /var/www/brewme-backend/uploads.
    location /uploads/ {
        alias /var/www/brewme-backend/uploads/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Everything else -> the Go API.
    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
